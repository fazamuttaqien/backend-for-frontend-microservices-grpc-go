services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./docker/postgres/init:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"], interval: 5s, timeout: 3s, retries: 10, start_period: 5s }
    networks: [backend]
  redis:
    image: redis:8-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    networks: [backend]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, timeout: 5s, retries: 10 }
    networks: [backend]
  alloy:
    image: grafana/alloy:latest
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data"]
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:?GRAFANA_CLOUD_OTLP_ENDPOINT must be set}
      GRAFANA_CLOUD_LOKI_ENDPOINT: ${GRAFANA_CLOUD_LOKI_ENDPOINT:?GRAFANA_CLOUD_LOKI_ENDPOINT must be set}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:?GRAFANA_CLOUD_INSTANCE_ID must be set}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:?GRAFANA_CLOUD_API_KEY must be set}
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability, egress]
  user-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: services/user } }
    environment:
      USER_DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres:5432/user_service
      USER_GRPC_PORT: 50051
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${USER_OTEL_RESOURCE_ATTRIBUTES:-service.name=user-service,service.namespace=bff-microservices-grpc,deployment.environment=production,service.version=${USER_SERVICE_VERSION:-0.1.0}}
    depends_on: { postgres: { condition: service_healthy }, alloy: { condition: service_started } }
    healthcheck: { test: ["CMD", "/app/healthcheck", "localhost:50051"], interval: 5s, timeout: 3s, retries: 10, start_period: 5s }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, observability]
  product-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: services/product } }
    environment:
      PRODUCT_DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres:5432/product_service
      PRODUCT_GRPC_PORT: 50052
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-100}
      PRODUCT_CACHE_TTL_SECONDS: ${PRODUCT_CACHE_TTL_SECONDS:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${PRODUCT_OTEL_RESOURCE_ATTRIBUTES:-service.name=product-service,service.namespace=bff-microservices-grpc,deployment.environment=production,service.version=${PRODUCT_SERVICE_VERSION:-0.1.0}}
    depends_on: { postgres: { condition: service_healthy }, alloy: { condition: service_started } }
    healthcheck: { test: ["CMD", "/app/healthcheck", "localhost:50052"], interval: 5s, timeout: 3s, retries: 10, start_period: 5s }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, observability]
  order-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: services/order } }
    environment:
      ORDER_DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres:5432/order_service
      ORDER_GRPC_PORT: 50053
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      USER_SERVICE_ADDRESS: user-service:50051
      PRODUCT_SERVICE_ADDRESS: product-service:50052
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER must be set}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${ORDER_OTEL_RESOURCE_ATTRIBUTES:-service.name=order-service,service.namespace=bff-microservices-grpc,deployment.environment=production,service.version=${ORDER_SERVICE_VERSION:-0.1.0}}
    depends_on: { postgres: { condition: service_healthy }, user-service: { condition: service_healthy }, product-service: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, alloy: { condition: service_started } }
    healthcheck: { test: ["CMD", "/app/healthcheck", "localhost:50053"], interval: 5s, timeout: 3s, retries: 10, start_period: 5s }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, observability]
  notification-consumer:
    build: { context: ., dockerfile: Dockerfile, args: { APP: consumers/notification } }
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER must be set}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@rabbitmq:5672/
    depends_on: { rabbitmq: { condition: service_healthy } }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  bff:
    build: { context: ., dockerfile: Dockerfile, args: { APP: bff } }
    environment:
      BFF_HTTP_PORT: 8080
      USER_SERVICE_ADDRESS: user-service:50051
      PRODUCT_SERVICE_ADDRESS: product-service:50052
      ORDER_SERVICE_ADDRESS: order-service:50053
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${BFF_OTEL_RESOURCE_ATTRIBUTES:-service.name=bff,service.namespace=bff-microservices-grpc,deployment.environment=production,service.version=${BFF_VERSION:-0.1.0}}
    ports: ["${BFF_HTTP_PORT:-8080}:8080"]
    depends_on: { user-service: { condition: service_healthy }, product-service: { condition: service_healthy }, order-service: { condition: service_healthy }, alloy: { condition: service_started } }
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"], interval: 5s, timeout: 3s, retries: 10, start_period: 5s }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, observability]
volumes: { postgres_data: {}, alloy_data: {} }
networks:
  backend: { driver: bridge }
  observability: { driver: bridge, internal: true }
  egress: { driver: bridge }
