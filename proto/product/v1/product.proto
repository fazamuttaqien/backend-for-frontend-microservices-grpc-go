syntax = "proto3";

package product.v1;

option go_package = "github.com/fazamuttaqien/backend-for-frontend-microservices-grpc-go/gen/product/v1;productv1";

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  int32 stock = 5;
  string created_at = 6;
  string updated_at = 7;
}

message CreateProductRequest { string name = 1; string description = 2; string price = 3; int32 stock = 4; }
message CreateProductResponse { Product product = 1; }
message GetProductRequest { string id = 1; }
message GetProductResponse { Product product = 1; }
message ListProductRequest { int32 page = 1; int32 page_size = 2; }
message ListProductResponse { repeated Product products = 1; int32 total = 2; }
message UpdateProductRequest { string id = 1; string name = 2; string description = 3; string price = 4; int32 stock = 5; }
message UpdateProductResponse { Product product = 1; }

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListProduct(ListProductRequest) returns (ListProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
}
