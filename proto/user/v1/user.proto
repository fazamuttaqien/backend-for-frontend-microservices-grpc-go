syntax = "proto3";

package user.v1;

option go_package = "github.com/fazamuttaqien/backend-for-frontend-microservices-grpc-go/gen/user/v1;userv1";

message User { string id=1; string name=2; string email=3; string created_at=4; string updated_at=5; }
message CreateUserRequest { string name=1; string email=2; string password=3; }
message CreateUserResponse { User user=1; }
message GetUserRequest { string id=1; }
message GetUserResponse { User user=1; }
message UpdateUserRequest { string id=1; string name=2; string email=3; string password=4; }
message UpdateUserResponse { User user=1; }
message LoginRequest { string email=1; string password=2; }
message LoginResponse { string access_token=1; int64 expires_at=2; User user=3; }
service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc Register(CreateUserRequest) returns (CreateUserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
}
