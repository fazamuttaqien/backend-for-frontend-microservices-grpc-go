name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: bufbuild/buf-setup-action@v1
      - run: buf generate
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
