stream_over_http_enabled: true

auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

internal_server:
  enable: true
  http_listen_address: 0.0.0.0
  http_listen_port: 3101

usage_report:
  reporting_enabled: false
